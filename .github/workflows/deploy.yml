name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            echo "Navigating to project directory..."
            cd ${{ secrets.VPS_TARGET_DIR || '/var/www/safe-health' }}

            echo "Pulling latest changes from main..."
            git pull origin main

            echo "Removing old build artifacts..."
            rm -rf .next

            echo "Installing dependencies..."
            npm ci

            echo "Building Next.js application..."
            npm run build

            echo "Reloading application with PM2..."
            if pm2 describe safehealth-web > /dev/null 2>&1; then
              pm2 reload safehealth-web --update-env
            else
              pm2 start npm --name "safehealth-web" -- start
              pm2 save
            fi
            echo "Deployment completed successfully!"
