<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0EDF8" />
      <stop offset="100%" stop-color="#DFD9EE" />
    </linearGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9D8EC2" />
      <stop offset="100%" stop-color="#7967A6" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#392579" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)" />

  <!-- Inner Soft Ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#392579" stroke-opacity="0.06" stroke-width="4" />

  <!-- Avatar Group with Clip to Circle -->
  <g clip-path="url(#circleClip)" filter="url(#subtleShadow)">
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="256" />
    </clipPath>

    <!-- Head -->
    <circle cx="256" cy="195" r="85" fill="url(#silhouetteGrad)" />

    <!-- Shoulders & Torso -->
    <path d="M256 310 C165 310 95 365 75 445 C115 488 180 512 256 512 C332 512 397 488 437 445 C417 365 347 310 256 310 Z" fill="url(#silhouetteGrad)" />

    <!-- Subtle Stethoscope / Collar Accent in Secondary Teal -->
    <path d="M220 325 C220 355 240 375 256 375 C272 375 292 355 292 325" fill="none" stroke="#14B8A6" stroke-width="7" stroke-linecap="round" stroke-opacity="0.65" />
    <circle cx="256" cy="382" r="6" fill="#14B8A6" fill-opacity="0.75" />
  </g>
</svg>